<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차일드락 시뮬레이터</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 960px; }
  fieldset { margin-bottom: 12px; }
  label { display: inline-block; margin: 2px 10px 2px 0; }
  .out { display: flex; gap: 16px; }
  .door { flex: 1; border: 1px solid #888; padding: 12px; text-align: center; font-size: 1.4em; }
  .LOCK { background: #fde2e2; } .RELEASE { background: #e2f5e2; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85em; }
  td, th { border: 1px solid #ccc; padding: 2px 6px; }
</style>
</head>
<body>
<h1>전자식 차일드락 시뮬레이터 (PC/SIL)</h1>
<fieldset><legend>차량 입력 (OEM-IF-001~003, 007~009)</legend>
  <label>시각 timestamp_s <input id="timestamp_s" type="number" step="0.05" value="0"></label>
  <label>차속 km/h <input id="vehicle_speed_kph" type="number" step="0.1" value="0"></label>
  <label>기어 <select id="gear"><option>P</option><option>N</option><option>D</option><option>R</option></select></label>
  <label>충돌 <select id="crash_status"><option>NONE</option><option>PENDING</option><option>CONFIRMED</option></select></label><br>
  <span id="flags"></span>
</fieldset>
<fieldset><legend>운전자 명령 (OEM-IF-004)</legend>
  <label>대상 <select id="side"><option>left</option><option>right</option><option>all</option></select></label>
  <label>경로 <select id="source"><option>physical_button</option><option>avn</option><option>voice</option><option>mobile_app</option></select></label>
  <button onclick="step('lock')">잠금</button>
  <button onclick="step('unlock')">해제</button>
  <button onclick="step(null)">입력만 전송</button>
</fieldset>
<div class="out">
  <div id="left" class="door">왼쪽</div>
  <div id="right" class="door">오른쪽</div>
</div>
<p id="meta"></p>
<h2>최근 이벤트</h2>
<table><thead><tr><th>ID</th><th>시각</th><th>왼쪽</th><th>오른쪽</th><th>상태</th><th>이유</th><th>입력</th></tr></thead>
<tbody id="events"></tbody></table>
<script>
const FLAGS = ["ignition_on", "sensor_fault", "rear_left_approach_risk",
  "rear_right_approach_risk", "fire_detected", "overtemperature_detected",
  "adult_present", "isofix_left", "isofix_right"];
document.getElementById("flags").innerHTML = FLAGS.map(f =>
  `<label><input type="checkbox" id="${f}" ${f === "ignition_on" ? "checked" : ""}> ${f}</label>`).join("");

function vehicle() {
  const v = {
    timestamp_s: Number(document.getElementById("timestamp_s").value),
    vehicle_speed_kph: Number(document.getElementById("vehicle_speed_kph").value),
    gear: document.getElementById("gear").value,
    crash_status: document.getElementById("crash_status").value,
  };
  FLAGS.forEach(f => v[f] = document.getElementById(f).checked);
  return v;
}

function show(s) {
  for (const side of ["left", "right"]) {
    const el = document.getElementById(side);
    const value = s["lock_" + side];
    el.className = "door " + value;
    el.textContent = (side === "left" ? "왼쪽 " : "오른쪽 ") + value;
  }
  document.getElementById("meta").textContent =
    `상태 ${s.state} · 이유 ${s.reason_code} · 입력 ${s.input_validity}`;
}

async function refreshEvents() {
  const events = await (await fetch("/api/events")).json();
  document.getElementById("events").innerHTML = events.slice().reverse().map(e =>
    `<tr><td>${e.event_id}</td><td>${e.timestamp_s}</td><td>${e.lock_left}</td>` +
    `<td>${e.lock_right}</td><td>${e.state}</td><td>${e.reason_code}</td>` +
    `<td>${e.input_validity}</td></tr>`).join("");
}

async function step(action) {
  const v = vehicle();
  const body = { now_s: v.timestamp_s, vehicle: v };
  if (action) {
    body.command = { side: document.getElementById("side").value, action,
      source: document.getElementById("source").value };
  }
  const res = await fetch("/api/step", { method: "POST", body: JSON.stringify(body) });
  show(await res.json());
  await refreshEvents();
  const t = document.getElementById("timestamp_s");
  t.value = (Number(t.value) + 0.05).toFixed(2);
}

fetch("/api/status").then(r => r.json()).then(show);
refreshEvents();
</script>
</body>
</html>
