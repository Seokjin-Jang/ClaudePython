[project]
name = "child-lock"
version = "0.1.0"
description = "전자식 차일드락 제어 SW (PC/SIL 참조 구현, 교육용 VJ-ECL-2026)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import 정렬, N: 명명 규칙(Google 스타일과
# 같은 범위), C90: 순환 복잡도, B: 버그 위험 패턴, UP: 최신 문법
select = ["E", "W", "F", "I", "N", "C90", "B", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10
